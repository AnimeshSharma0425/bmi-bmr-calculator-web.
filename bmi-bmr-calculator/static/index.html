<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI &amp; BMR Calculator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>BMI &amp; BMR Calculator</h1>
    <p class="subtitle">Daily Calorie Calculator</p>

    <form id="calc-form" autocomplete="off">
      <div class="field">
        <label for="age">Enter your age</label>
        <input id="age" type="number" min="1" max="129" step="1" required />
      </div>

      <div class="field">
        <label for="gender">Enter your gender</label>
        <select id="gender" required>
          <option value="" disabled selected>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="grid">
        <div class="field">
          <label for="weight">Weight (kg)</label>
          <input id="weight" type="number" min="1" step="any" required />
        </div>
        <div class="field">
          <label for="height">Height (cm)</label>
          <input id="height" type="number" min="1" step="any" required />
        </div>
      </div>

      <div class="field">
        <label for="activity">Choose activity level</label>
        <select id="activity" required>
          <option value="" disabled selected>Select activity level</option>
          <option value="1">1. Sedentary - Little or no exercise</option>
          <option value="2">2. Lightly Active - Exercise 1-3 days/week</option>
          <option value="3">3. Moderately Active - Exercise 3-5 days/week</option>
          <option value="4">4. Very Active - Exercise 6-7 days/week</option>
        </select>
      </div>

      <button type="submit" id="submit-btn">Calculate</button>
    </form>

    <p id="error" class="error" role="alert"></p>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>Result</h2>
      <div class="result-grid">
        <div class="stat">
          <span class="label">Your BMI</span>
          <span class="value" id="bmi"></span>
          <span class="badge" id="category"></span>
        </div>
        <div class="stat">
          <span class="label">Your BMR</span>
          <span class="value" id="bmr"></span>
          <span class="unit">calories/day</span>
        </div>
      </div>
      <div class="stat wide">
        <span class="label">Estimated daily calorie requirement</span>
        <span class="value big" id="calories"></span>
        <span class="unit">calories/day</span>
      </div>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
